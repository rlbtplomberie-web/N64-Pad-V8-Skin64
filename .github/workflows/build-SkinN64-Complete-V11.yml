name: Build SkinN64 Complete V11 ARM64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Télécharger la base M64Plus FZ verrouillée
        run: |
          git clone --filter=blob:none https://github.com/fzurita/mupen64plus-ae.git m64fz
          cd m64fz
          git checkout f3c381bcc58e4adce897aba323193d3f407e30e3

      - name: Installer SkinN64 Complete V11
        run: |
          archive=$(find . -maxdepth 2 -type f -name 'SkinN64-Complete-V11.zip' -print -quit)
          if [ -z "$archive" ]; then
            echo "ERREUR : SkinN64-Complete-V11.zip introuvable."
            exit 1
          fi
          mkdir -p package
          unzip -q "$archive" -d package
          marker=$(find package -type f -name 'SKINN64_COMPLETE_V11' -print -quit)
          if [ -z "$marker" ]; then
            echo "ERREUR : le ZIP V11 est incorrect."
            exit 1
          fi
          overlay_dir=$(dirname "$marker")
          cp -a "$overlay_dir"/. m64fz/

      - name: Configurer Android et GitHub Packages
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf 'sdk.dir=%s\ngpr.user=%s\ngpr.key=%s\n' "$ANDROID_SDK_ROOT" "$GH_USER" "$GH_TOKEN" > m64fz/local.properties

      - name: Compiler l’APK
        working-directory: m64fz
        run: ./gradlew :app:clean :app:assembleProDebug --no-daemon --stacktrace --no-build-cache

      - name: Vérifier et préparer l’APK
        run: |
          mkdir -p apk-result
          apk=$(find m64fz/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "ERREUR : aucun APK produit."
            find m64fz/app/build -type f | tail -200 || true
            exit 1
          fi
          unzip -l "$apk" | grep -q 'assets/skinn64/portrait/positions.json' || { echo "ERREUR : pad vertical absent."; exit 1; }
          unzip -l "$apk" | grep -q 'assets/skinn64/paysage/positions.json' || { echo "ERREUR : pad horizontal absent."; exit 1; }
          mkdir -p dex-check
          unzip -q "$apk" 'classes*.dex' -d dex-check
          strings dex-check/classes*.dex | grep -q 'SkinN64TouchMap' || { echo "ERREUR : moteur tactile SkinN64 absent de l’APK."; exit 1; }
          strings dex-check/classes*.dex | grep -q 'variante_paysage' || { echo "ERREUR : changement de pad absent de l’APK."; exit 1; }
          for bouton in ff menu jeux cheat quit; do
            unzip -l "$apk" | grep -q "assets/skinn64/portrait/${bouton}_0.png" || { echo "ERREUR : bouton $bouton absent."; exit 1; }
          done
          cp "$apk" apk-result/SkinN64-Complete-V11-ARM64.apk

      - name: Publier l’APK
        uses: actions/upload-artifact@v4
        with:
          name: SkinN64-Complete-V11-ARM64
          path: apk-result/SkinN64-Complete-V11-ARM64.apk
          if-no-files-found: error
